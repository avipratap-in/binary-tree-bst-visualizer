name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          pytest -v

      - name: Build static distribution
        run: |
          python scripts/build_static.py

      - name: Verify static build and Python manifest
        run: |
          python -c "import json, pathlib, sys; p = pathlib.Path('dist/py/manifest.json'); sys.exit('dist/py/manifest.json missing') if not p.exists() else None; m = json.loads(p.read_text()); missing = [f for f in m.get('files', []) if not (pathlib.Path('dist/py') / f).exists()]; sys.exit(f'Missing manifest files: {missing}') if missing else print(f'Verified {len(m.get(\"files\", []))} files in dist/py/manifest.json.')"

      - name: Verify Pyodide sandbox execution without Flask
        run: |
          python scripts/verify_pyodide_sandbox.py

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
